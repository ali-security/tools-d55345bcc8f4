# Sealed build for golang.org/x/tools v0.0.0-20200312045724-11d5b4c81c7d.
#
# Upstream golang.org/x/tools has no GitHub Actions CI: changes are reviewed on
# Gerrit and tested on the Go build dashboard. This workflow is authored for
# the sealed build. It:
#   - packages the module zip exactly as the module proxy does
#     (golang.org/x/mod/zip.CreateFromDir), and
#   - runs the repo's own `go test ./...` suite (the root module and the nested
#     gopls module) on Linux and Windows with Go 1.13, the toolchain current at
#     the 2020-03 release.
name: seal-build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Go package pattern(s) to test instead of the full suite"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  module-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Build create_mod helper
        run: |
          set -eux
          helper="$(mktemp -d)"
          cp .github/create_mod.go "$helper/"
          cd "$helper"
          go mod init example.com/mod
          go get golang.org/x/mod@v0.24.0
          go build -o "$RUNNER_TEMP/create_mod" create_mod.go

      - name: Stage module source
        run: |
          set -eux
          mkdir -p "$RUNNER_TEMP/zipsrc" "$RUNNER_TEMP/out"
          tar -c --exclude=.git --exclude=.github -C "$GITHUB_WORKSPACE" . | tar -x -C "$RUNNER_TEMP/zipsrc"
          test ! -e "$RUNNER_TEMP/zipsrc/.git"
          test ! -e "$RUNNER_TEMP/zipsrc/.github"
          test -f "$RUNNER_TEMP/zipsrc/go.mod"

      - name: Create module zip
        run: |
          set -eux
          "$RUNNER_TEMP/create_mod" golang.org/x/tools v0.0.0-20200312045724-11d5b4c81c7d "$RUNNER_TEMP/zipsrc" "$RUNNER_TEMP/out/v0.0.0-20200312045724-11d5b4c81c7d.zip"
          test "$(unzip -Z1 "$RUNNER_TEMP/out/v0.0.0-20200312045724-11d5b4c81c7d.zip" | wc -l)" -eq 1375

      - uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: ${{ runner.temp }}/out/v0.0.0-20200312045724-11d5b4c81c7d.zip
          if-no-files-found: error

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    defaults:
      run:
        shell: bash
    env:
      # Go 1.13's default. The repo has go.mod so the suite still runs in module
      # mode, but internal/lsp/regtest (TestDiagnosticErrorInNewFile) spawns
      # gopls on a temp workspace with no go.mod, which must fall back to GOPATH
      # mode ("go: cannot find main module" under GO111MODULE=on).
      GO111MODULE: "auto"
      GOPROXY: "https://proxy.golang.org,direct"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.13.15"
          cache: false

      # Go 1.13's prebuilt runtime/cgo references the msvcrt `__iob_func`
      # symbol, which the runner's UCRT-based mingw toolchain no longer
      # provides. The cgo tests (cmd/stringer, go/packages) need an
      # msvcrt-based gcc, so install MSYS2's MINGW64 gcc and put it first on PATH.
      - name: Install msvcrt mingw gcc (Windows)
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc

      - name: Put mingw64 gcc on PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -eux
          echo "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin" >> "$GITHUB_PATH"
          # Use the full runner temp path for TEMP/TMP (avoid the 8.3 short
          # path form RUNNER~1, which trips path comparisons in tests).
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Build
        run: |
          set -eux
          go version && go env
          go build ./...

      # -p 1: cmd/godoc TestWebIndex only waits 2 minutes for the search index
      # to be built and times out under parallel package load.
      - name: Test root module
        run: |
          set -euo pipefail
          go test -v -p 1 ${{ inputs.test-filter || './...' }} 2>&1 | tee "$RUNNER_TEMP/go-test.log"

      - name: Test gopls module
        if: inputs.test-filter == ''
        working-directory: gopls
        run: |
          set -euo pipefail
          go test -v -p 1 ./... 2>&1 | tee "$RUNNER_TEMP/go-test-gopls.log"

      # Informational only: earlier steps already fail the job on test failure.
      - name: Test summary
        if: always()
        run: |
          tp=0; tf=0; ts=0; tok=0; tpf=0
          for log in "$RUNNER_TEMP/go-test.log" "$RUNNER_TEMP/go-test-gopls.log"; do
            [ -f "$log" ] || continue
            read -r p f s ok pf <<<"$(awk '
              /^ *--- PASS:/ { p++ }
              /^ *--- FAIL:/ { f++ }
              /^ *--- SKIP:/ { s++ }
              /^ok[ \t]/     { ok++ }
              /^FAIL[ \t]/   { pf++ }
              END { printf "%d %d %d %d %d\n", p, f, s, ok, pf }
            ' "$log")"
            echo "SUMMARY $log: tests passed=$p failed=$f skipped=$s; packages ok=$ok failed=$pf"
            tp=$((tp + p)); tf=$((tf + f)); ts=$((ts + s)); tok=$((tok + ok)); tpf=$((tpf + pf))
          done
          echo "SUMMARY total: tests passed=$tp failed=$tf skipped=$ts; packages ok=$tok failed=$tpf"
